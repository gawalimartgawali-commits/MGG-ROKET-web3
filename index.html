<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGG ROKET - Web3 Autopool</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>

.header{background:#0a1740;padding:12px;display:flex;justify-content:space-between;align-items:center}
.btn{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;padding:10px 18px;border:none;border-radius:8px;font-weight:bold}
.hero{padding:30px 15px;background:radial-gradient(circle at top,#1a2f70,#060d24)}
.card{background:#111e44;border:1px solid #1e3a8a;border-radius:12px;padding:12px;margin:6px;display:inline-block;width:155px;vertical-align:top}
.packages{padding:10px}

</head>
<body>
<div class="header"><b>🚀 MGG ROKET</b><button class="btn" id="cBtn">Connect Wallet</button></div>
<div class="hero"><h2>Auto Grow USDT with <span style="color:#4f8cff">MGG ROKET</span></h2><p>Single Leg | 5 Autopool | Full Upgrade | USDT BEP-20</p><p id="wAddr" style="color:#4ade80;margin-top:10px"></p></div>
<div class="packages" id="pkgs"></div>
<div style="padding:20px;background:#0a1740;margin:15px;border-radius:10px"><b>🔄 FULL UPGRADE RULE</b><br><small>$2 to $5 jayche tar FULL $5 pay. Company 20% return + Level Income return = Double Profit</small></div>
<script>
const pkgs=[2,5,10,20,50,100,200,500,1000,2000];
let signer;
async function connect(){if(window.ethereum){let p=new ethers.providers.Web3Provider(window.ethereum);await p.send("eth_requestAccounts",[]);signer=p.getSigner();let a=await signer.getAddress();document.getElementById("wAddr").innerText="Connected: "+a.slice(0,6)+"..."+a.slice(-4)+" ✅";}}
document.getElementById("cBtn").onclick=connect;
let h="";pkgs.forEach(pr=>{h+=`<div class=card><h3>$${pr}</h3><p>Total Return $${pr*115}</p><p style="color:#4ade80;font-size:11px">P1-P5 Autopool</p><button class=btn onclick="if(!signer){alert('Connect Wallet kara')}else{alert('Buy $${pr} USDT')}" style="width:100%;margin-top:5px">Buy with USDT</button><div style="margin-top:5px;font-size:10px;color:#fde68a">Full Upgrade: Pay $${pr}</div></div>`});
document.getElementById("pkgs").innerHTML=h;
</script>
</body>
</html>
