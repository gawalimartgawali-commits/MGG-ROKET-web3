<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGG ROCKET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#0a0e1a;color:#fff;font-family:system-ui;padding:12px}
.card{background:#151c2f;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #1e293b}
.logo{color:#ff7a00;font-weight:900;font-size:22px} .btn{padding:12px;border-radius:12px;font-weight:800;border:none;cursor:pointer}
.btn-orange{background:#ff7a00;color:#fff} .btn-green{background:#00ff88;color:#000;width:100%;margin-top:8px}
input{width:100%;background:#000;border:1px solid #333;padding:14px;border-radius:10px;color:#fff;margin:8px 0}
.pkgBtn{background:#1a233a;border:1px solid #ff7a00;color:#fff;padding:12px;border-radius:10px;font-weight:700;font-size:13px}
#statusMsg{background:#000;padding:12px;border-radius:8px;font-size:13px;color:#00ff88;display:none;margin-top:8px;border:1px solid #ff7a00}
</style>
</head>
<body>

<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<div class="logo">🚀 MGG ROCKET</div>
<button class="btn btn-orange" id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
</div>

<div class="card">
<div style="color:#8892b0;font-size:11px">CONNECTED WALLET</div>
<div id="walletAddr" style="color:#ff7a00;font-weight:700;margin:6px 0;font-size:14px">Not Connected</div>
<div style="display:flex;justify-content:space-between;font-size:12px"><span>Network:</span><span id="netName">BNB Smart Chain</span></div>
<div id="statusMsg"></div>
</div>

<div class="card" style="border:2px solid #ff7a00">
<div style="font-weight:900;font-size:15px">🎯 ACTIVATE PACKAGE - ALL 15 LEVELS</div>
<input id="refInput" placeholder="Referral Auto" readonly style="font-size:12px;color:#888">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">
<button onclick="buyPkg(2)" class="pkgBtn">$2 BUY</button><button onclick="buyPkg(5)" class="pkgBtn">$5 BUY</button><button onclick="buyPkg(10)" class="pkgBtn">$10 BUY</button>
<button onclick="buyPkg(20)" class="pkgBtn">$20 BUY</button><button onclick="buyPkg(50)" class="pkgBtn">$50 BUY</button><button onclick="buyPkg(100)" class="pkgBtn">$100 BUY</button>
<button onclick="buyPkg(200)" class="pkgBtn">$200 BUY</button><button onclick="buyPkg(500)" class="pkgBtn">$500 BUY</button><button onclick="buyPkg(1000)" class="pkgBtn">$1000 BUY</button>
<button onclick="buyPkg(2000)" class="pkgBtn">$2000 BUY</button><button onclick="buyPkg(3000)" class="pkgBtn">$3000 BUY</button><button onclick="buyPkg(5000)" class="pkgBtn">$5000 BUY</button>
<button onclick="buyPkg(7000)" class="pkgBtn">$7000 BUY</button><button onclick="buyPkg(9000)" class="pkgBtn">$9000 BUY</button><button onclick="buyPkg(10000)" class="pkgBtn" style="background:#ff7a00;color:#000">$10000 BUY</button>
</div>
</div>

<script>
let userAddress=null;
const CREATOR="0x843162bFc44b13dAAdB13652681b3902332f324D";
const params=new URLSearchParams(window.location.search);
window.onload=()=>{ document.getElementById('refInput').value=params.get('ref')||''; checkWallet(); }

function showMsg(t,err=false){
  let m=document.getElementById('statusMsg');
  m.style.display='block';
  m.style.color=err?'#ff5555':'#00ff88';
  m.style.borderColor=err?'#ff5555':'#00ff88';
  m.innerText=t;
}

async function checkWallet(){
  // SafePal detection
  const hasWallet = !!(window.ethereum || window.safepalProvider || window.safepal);
  if(!hasWallet){
    showMsg('⚠️ Wallet सापडला नाही! SafePal DApp Browser मध्येच उघडा आहे का बघा',true);
    return;
  }
}

async function connectWallet(){
  showMsg('⏳ Connecting to SafePal... Approvel द्या');
  let provider = window.ethereum || window.safepalProvider || window.safepal;
  
  if(!provider){
    showMsg('❌ Provider नाही! SafePal -> DApps -> मध्ये ही लिंक उघडा: https://mgg-roket.vercel.app',true);
    alert('SafePal App मध्ये:\n1) DApps वर जा\n2) वरती URL टाका\n3) Connect दाबा');
    return;
  }

  try{
    // SafePal साठी direct request
    const accounts = await provider.request({method:'eth_requestAccounts'});
    if(!accounts || accounts.length==0){ showMsg('❌ Account मिळाला नाही',true); return; }
    
    userAddress = accounts[0];
    document.getElementById('walletAddr').innerText = userAddress.slice(0,6)+'...'+userAddress.slice(-4)+' ✅ Connected';
    document.getElementById('connectBtn').innerText = 'Connected ✅';
    document.getElementById('connectBtn').style.background = '#00ff88';
    document.getElementById('connectBtn').style.color = '#000';
    
    // Switch to BSC
    try{
      await provider.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x38'}]});
      document.getElementById('netName').innerText='BNB Smart Chain ✅';
    }catch(e){
      // Try add chain
      try{
        await provider.request({method:'wallet_addEthereumChain',params:[{chainId:'0x38',chainName:'BNB Smart Chain',rpcUrls:['https://bsc-dataseed.binance.org/'],nativeCurrency:{name:'BNB',symbol:'BNB',decimals:18}}]});
      }catch(e2){}
    }
    
    showMsg('✅ Connected! Address: '+userAddress+'\nआता कोणताही Package BUY करू शकता');
    
  }catch(err){
    console.error(err);
    if(err.code==4001){
      showMsg('❌ तुम्ही Reject केलं! परत Connect दाबा आणि Approve करा',true);
    }else{
      showMsg('❌ Error: '+err.message+' | Code: '+err.code,true);
    }
  }
}

function buyPkg(a){
  if(!userAddress){ showMsg('❌ आधी वर Connect Wallet दाबा!',true); return; }
  showMsg('⏳ $'+a+' BUY - Contract Deploy झाल्यावर Real Payment होईल. आता Demo');
}
</script>
</body>
</html>
