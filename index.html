<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
    const CONTRACT_ADDRESS = "0x843162bFc44b13dAAdB13652681b3902332f324D";
    const USDT_ADDRESS = "0x55d398326f99059ff775485246999027b3197955";

    // तुमच्या कॉन्ट्रॅक्टचे आवश्यक ABI (Functions & Views)
    const CONTRACT_ABI = [
        "function buyLevel(uint256 level, address referrer) external",
        "function users(address) view returns (uint256 id, address referrer, uint256 partnersCount, uint256 income)",
        "function levelIncome(address, uint256) view returns (uint256)",
        "function isUserExists(address) view returns (bool)"
    ];

    const USDT_ABI = [
        "function approve(address spender, uint256 amount) external returns (bool)",
        "function allowance(address owner, address spender) view returns (uint256)"
    ];

    let provider, signer, userAddress, contract;

    async function connectWallet() {
        if (typeof window.ethereum !== 'undefined') {
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                
                document.getElementById("connectBtn").innerText = userAddress.substring(0, 6) + "..." + userAddress.substring(38);
                document.getElementById("walletStatus").innerText = userAddress;
                
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                loadUserData();
            } catch (error) {
                console.error(error);
                alert("वॉलेट कनेक्ट करताना एरर आली!");
            }
        } else {
            alert("कृपया Trust Wallet किंवा Web3 ब्राउझर वापरा!");
        }
    }

    async function loadUserData() {
        try {
            // USDT बॅलन्स तपासणे
            const usdtContract = new ethers.Contract(USDT_ADDRESS, ["function balanceOf(address) view returns (uint256)"], provider);
            const balance = await usdtContract.balanceOf(userAddress);
            document.getElementById("usdtBalance").innerText = parseFloat(ethers.utils.formatUnits(balance, 18)).toFixed(2) + " USDT";

            // युजरची माहिती (Members & Income) कॉन्ट्रॅक्टमधून फेच करणे
            const userInfo = await contract.users(userAddress);
            document.getElementById("totalPartners").innerText = userInfo.partnersCount.toString();
            document.getElementById("totalIncome").innerText = ethers.utils.formatUnits(userInfo.income, 18) + " USDT";
        } catch (e) {
            console.log("Data load error: ", e);
        }
    }

    async function approveAndBuy(levelIndex, priceInUSDT, defaultRef) {
        let refAddress = document.getElementById("sponsorInput").value || defaultRef;
        if (!ethers.utils.isAddress(refAddress)) {
            alert("कृपया वैध स्पॉन्सर (रिफरर) ॲड्रेस टाका!");
            return;
        }

        try {
            const usdtContract = new ethers.Contract(USDT_ADDRESS, USDT_ABI, signer);
            const amount = ethers.utils.parseUnits(priceInUSDT.toString(), 18);

            alert("पायरी १: USDT अप्रूव्ह होत आहे...");
            const txApprove = await usdtContract.approve(CONTRACT_ADDRESS, amount);
            await txApprove.wait();

            alert("पायरी २: लेव्हल खरेदी ट्रान्जेक्शन सुरू होत आहे...");
            const txBuy = await contract.buyLevel(levelIndex, refAddress);
            await txBuy.wait();

            alert("अभिनंदन! लेव्हल यशस्वीपणे ॲक्टिव्ह झाली आहे!");
            loadUserData();
        } catch (error) {
            console.error(error);
            alert("ट्रान्जेक्शन अयशस्वी झाले: " + (error.data?.message || error.message));
        }
    }

    window.onload = function() {
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
                if (accounts.length > 0) connectWallet();
            });
        }
    };
</script>
