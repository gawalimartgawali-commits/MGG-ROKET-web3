<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGGRoket - Web3 Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v5 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        .gradient-bg {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
        }
        .card-glow {
            box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.15);
        }
    </style>
</head>
<body class="gradient-bg text-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- Header / Navbar -->
    <header class="w-full max-w-5xl flex justify-between items-center py-5 border-b border-slate-800/80 mb-8">
        <div class="flex items-center gap-2">
            <span class="text-3xl">🚀</span>
            <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-orange-400 via-amber-300 to-yellow-500 bg-clip-text text-transparent">
                MGGROKET
            </h1>
        </div>
        <button id="connectWalletBtn" onclick="connectWallet()" class="bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg shadow-orange-500/20 transition-all active:scale-95">
            Connect Wallet
        </button>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-5xl space-y-8">

        <!-- User Info Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-900/80 backdrop-blur-md p-6 rounded-2xl border border-slate-800 card-glow flex flex-col justify-between">
                <div>
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Connected Wallet</span>
                    <p id="userAddress" class="text-lg font-mono font-bold text-orange-400 mt-1 truncate">Not Connected</p>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-800 flex justify-between items-center">
                    <span class="text-sm text-slate-400">Network:</span>
                    <span id="networkName" class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">BNB Smart Chain</span>
                </div>
            </div>

            <div class="bg-slate-900/80 backdrop-blur-md p-6 rounded-2xl border border-slate-800 card-glow flex flex-col justify-between">
                <div>
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">USDT Balance</span>
                    <p class="text-3xl font-black text-emerald-400 mt-1"><span id="usdtBalance">0.00</span> <span class="text-base font-normal text-slate-400">USDT</span></p>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-800 flex justify-between items-center">
                    <span class="text-sm text-slate-400">Status:</span>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20 font-medium">Ready</span>
                </div>
            </div>
        </div>

        <!-- Buy Package Section -->
        <div class="bg-slate-900/80 backdrop-blur-md p-6 md:p-8 rounded-2xl border border-slate-800 card-glow space-y-6">
            <div>
                <h2 class="text-xl font-bold text-slate-100">Select Package & Join</h2>
                <p class="text-sm text-slate-400 mt-1">Choose a level package below to upgrade or register.</p>
            </div>

            <!-- Level Selector Cards Grid -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Choose Level Package (Level 1 - 20)</label>
                <div id="levelGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3 max-h-60 overflow-y-auto pr-1">
                    <!-- Dynamic JavaScript Level Buttons will be generated here -->
                </div>
            </div>

            <!-- Selected Package Price Display -->
            <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800/80 flex justify-between items-center">
                <span class="text-sm text-slate-400">Selected Level: <strong id="selectedLevelText" class="text-orange-400">Level 1 (Index 0)</strong></span>
                <span class="text-lg font-bold text-white">Price: <span id="selectedPriceText" class="text-emerald-400">2</span> USDT</span>
            </div>

            <!-- Referrer Input -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Sponsor / Referrer Address</label>
                <input type="text" id="referrerInput" placeholder="0x..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-orange-500 transition">
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                <button onclick="approveUSDT()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/20 active:scale-95">
                    1. Approve USDT
                </button>
                <button onclick="buyPackage()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/20 active:scale-95">
                    2. Buy Package
                </button>
            </div>
        </div>

        <!-- Referral Link Section -->
        <div class="bg-slate-900/80 backdrop-blur-md p-6 rounded-2xl border border-slate-800 card-glow space-y-3">
            <h2 class="text-md font-bold text-slate-200">Your Affiliate Referral Link</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="refLink" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-400 font-mono text-xs sm:text-sm" value="Connect wallet to generate referral link">
                <button onclick="copyRefLink()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-6 py-3 rounded-xl border border-slate-700 transition shrink-0 active:scale-95">
                    Copy Link
                </button>
            </div>
        </div>

    </main>

    <!-- JavaScript Integration -->
    <script>
        // ==== CONFIGURATION ====
        const CONTRACT_ADDRESS = "0x843162bFc44b13dAAdB13652681b3902332f324D";
      
        const USDT_ADDRESS = "0x55d398326f99059ff775485246999027b3197955"; // BSC Mainnet USDT
        // =======================

        const packagePrices = [
            "2", "5", "10", "20", "50", "100", "200", "400", "800", "1500",
            "3000", "6000", "12000", "25000", "50000", "100000", "200000", "400000", "800000", "1500000"
        ];

        let selectedLevelIndex = 0;

        const mggrAbi = [
            "function buyPackage(uint256 levelIndex, address referrer) external",
            "function packagePrices(uint256) view returns (uint256)"
        ];

        const usdtAbi = [
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function balanceOf(address account) external view returns (uint256)"
        ];

        let provider, signer, userAccount;

        // Initialize Level Grid
        function initLevelGrid() {
            const grid = document.getElementById("levelGrid");
            grid.innerHTML = "";
            packagePrices.forEach((price, idx) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = `level-btn text-left p-3 rounded-xl border transition ${idx === 0 ? 'bg-orange-500/20 border-orange-500 text-white' : 'bg-slate-950/60 border-slate-800 text-slate-400 hover:border-slate-700'}`;
                btn.onclick = () => selectLevel(idx);
                btn.id = `level-btn-${idx}`;
                btn.innerHTML = `
                    <div class="text-xs font-bold uppercase">Level ${idx + 1}</div>
                    <div class="text-sm font-black text-white mt-0.5">${price} <span class="text-[10px] text-slate-400 font-normal">USDT</span></div>
                `;
                grid.appendChild(btn);
            });
        }

        function selectLevel(index) {
            selectedLevelIndex = index;
            document.querySelectorAll(".level-btn").forEach((b, i) => {
                if (i === index) {
                    b.className = "level-btn text-left p-3 rounded-xl border transition bg-orange-500/20 border-orange-500 text-white";
                } else {
                    b.className = "level-btn text-left p-3 rounded-xl border transition bg-slate-950/60 border-slate-800 text-slate-400 hover:border-slate-700";
                }
            });
            document.getElementById("selectedLevelText").innerText = `Level ${index + 1} (Index ${index})`;
            document.getElementById("selectedPriceText").innerText = packagePrices[index];
        }

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    userAccount = await signer.getAddress();

                    document.getElementById("userAddress").innerText = userAccount.substring(0, 6) + "..." + userAccount.substring(38);
                    document.getElementById("connectWalletBtn").innerText = "Connected";

                    // Referral Link
                    let currentUrl = window.location.origin + window.location.pathname;
                    document.getElementById("refLink").value = currentUrl + "?ref=" + userAccount;

                    const urlParams = new URLSearchParams(window.location.search);
                    const refParam = urlParams.get('ref');
                    if (refParam && ethers.utils.isAddress(refParam)) {
                        document.getElementById("referrerInput").value = refParam;
                    }

                    updateBalances();
                } catch (error) {
                    console.error(error);
                    alert("Wallet connection failed!");
                }
            } else {
                alert("Please open this page inside Trust Wallet Browser or MetaMask!");
            }
        }

        async function updateBalances() {
            try {
                const usdtContract = new ethers.Contract(USDT_ADDRESS, usdtAbi, provider);
                const balance = await usdtContract.balanceOf(userAccount);
                document.getElementById("usdtBalance").innerText = parseFloat(ethers.utils.formatUnits(balance, 18)).toFixed(2);
            } catch (err) {
                console.error(err);
            }
        }

        async function approveUSDT() {
            try {
                if (!signer) return alert("Please connect wallet first!");
                const priceInEther = packagePrices[selectedLevelIndex];
                const amount = ethers.utils.parseUnits(priceInEther, 18);

                const usdtContract = new ethers.Contract(USDT_ADDRESS, usdtAbi, signer);
                const tx = await usdtContract.approve(CONTRACT_ADDRESS, amount);
                alert("Approval transaction submitted. Please wait...");
                await tx.wait();
                alert("USDT Approved successfully!");
            } catch (error) {
                console.error(error);
                alert("Approval failed!");
            }
        }

        async function buyPackage() {
            try {
                if (!signer) return alert("Please connect wallet first!");
                const referrer = document.getElementById("referrerInput").value;

                if (!ethers.utils.isAddress(referrer)) {
                    alert("Please enter a valid referrer address!");
                    return;
                }

                const contract = new ethers.Contract(CONTRACT_ADDRESS, mggrAbi, signer);
                const tx = await contract.buyPackage(selectedLevelIndex, referrer);
                alert("Package purchase submitted. Please wait...");
                await tx.wait();
                alert("Package purchased successfully!");
                updateBalances();
            } catch (error) {
                console.error(error);
                alert("Purchase failed! Check balance and approval.");
            }
        }

        function copyRefLink() {
            const refLinkInput = document.getElementById("refLink");
            refLinkInput.select();
            document.execCommand("copy");
            alert("Referral link copied!");
        }

        window.onload = () => {
            initLevelGrid();
        };
    </script>
</body>
  </html>
