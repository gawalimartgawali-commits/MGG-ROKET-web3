<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGG LEGEND - Dual Joining opBNB + MGG</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.h{text-align:center;padding:20px;background:#0f0f00;border-bottom:2px solid #FFD700}
.h h1{color:#FFD700;margin:0;letter-spacing:1px}
.box-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
@media(min-width:700px){.box-wrap{grid-template-columns:repeat(4,1fr)}}
.box{background:#111;border:1px solid #333;border-radius:12px;padding:12px;text-align:center}
.box b{color:#FFD700;display:block}
.btn{padding:10px 18px;background:#FFD700;color:#000;font-weight:900;border:none;border-radius:20px;cursor:pointer;margin:2px}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:15px}
input{width:96%;padding:10px;background:#000;color:#fff;border:1px solid #FFD70066;border-radius:8px}
</style>
</head>
<body>
<div class="h">
<h1>MGG LEGEND GLOBAL - opBNB</h1>
<p>DUAL JOINING: MGG Token + opBNB | 20% Direct in BNB | 80% in MGG | Zero Balance</p>
</div>

<div style="padding:15px">
<button class="btn" onclick="connect()">CONNECT WALLET - opBNB</button>
<p id="w" style="font-size:11px;opacity:0.6">Not Connected | Token: 0x7bAFE...B39D | Creator: 0x8431...324D</p>

<div class="box-wrap">
<div class="box"><b id="team">0</b><small>Direct Team</small></div>
<div class="box"><b id="directBNB">0 BNB</b><small>Direct Income Wallet (opBNB 20%)</small></div>
<div class="box"><b id="autoMGG">0 MGG</b><small>Autopool Income (MGG 60% 3x)</small></div>
<div class="box"><b id="awardMGG">0 MGG</b><small>Award Income (MGG 10%)</small></div>
</div>

<input id="upline" value="0x843162bFc44b13dAAdB13652681b3902332f324D" placeholder="Upline Address">
<div class="grid" id="pkgs"></div>
</div>

<script>
const MGG_TOKEN = "0x7bAFE03A292fEf5bF3c60ae2c924a9956ff1B39D";
const CONTRACT_ADDRESS = "0xYOUR_CONTRACT_ADDRESS"; // Deploy नंतर टाक
const packagesMGG = [1000,2000,5000,10000,20000,50000,100000,200000,500000,1000000,2000000,5000000,10000000,20000000,50000000];
const packagesBNB = [0.0001,0.0002,0.0005,0.001,0.002,0.005,0.01,0.02,0.05,0.1,0.2,0.5,1,2,5]; // तू Rate बदलू शकतोस

const ERC20_ABI = ["function approve(address,uint256) returns (bool)"];
const CONTRACT_ABI = ["function joinWithMGG(uint8,address) external", "function joinWithBNB(uint8,address) external payable", "function getUser(address) view returns (uint256,uint256,uint256,uint256)"];

function render(){
  document.getElementById("pkgs").innerHTML = packagesMGG.map((m,i)=>`
    <div class="card">
      <b style="color:#FFD700">LEVEL ${i+1}</b><br>
      <small>Package: ${m.toLocaleString()} MGG = ${packagesBNB[i]} BNB (opBNB)<br>
      Dist: 20% Direct in BNB | 60% Autopool MGG | 10% Award MGG | 10% Creator MGG</small><br>
      <button class="btn" style="width:48%;background:#fff;color:#000" onclick="joinMGG(${i})">JOIN WITH MGG</button>
      <button class="btn" style="width:48%" onclick="joinBNB(${i})">JOIN WITH BNB</button>
    </div>
  `).join("");
}
render();

async function connect(){
  const provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts",[]);
  const signer = await provider.getSigner();
  document.getElementById("w").innerText = "Connected: " + await signer.getAddress();
  try{await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:"0xcc"}]})}catch(e){await window.ethereum.request({method:"wallet_addEthereumChain",params:[{chainId:"0xcc",chainName:"opBNB Mainnet",rpcUrls:["https://opbnb-mainnet-rpc.bnbchain.org"],nativeCurrency:{name:"BNB",symbol:"BNB",decimals:18}}]})}
}

async function joinMGG(level){
  try{
    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();
    const token = new ethers.Contract(MGG_TOKEN, ERC20_ABI, signer);
    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
    const amount = ethers.parseUnits(packagesMGG[level].toString(),18);
    const upline = document.getElementById("upline").value;
    const tx1 = await token.approve(CONTRACT_ADDRESS, amount); await tx1.wait();
    const tx2 = await contract.joinWithMGG(level, upline); await tx2.wait();
    alert("Joined with MGG! Direct 20% in BNB sent to upline.");
  }catch(e){alert(e.message)}
}

async function joinBNB(level){
  try{
    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();
    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
    const upline = document.getElementById("upline").value;
    const bnbAmount = ethers.parseEther(packagesBNB[level].toString());
    const tx = await contract.joinWithBNB(level, upline, {value: bnbAmount});
    await tx.wait();
    alert("Joined with BNB (opBNB)! Direct 20% in BNB sent to upline, rest MGG distributed.");
  }catch(e){alert(e.message)}
}
</script>
</body>
</html>
