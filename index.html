<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGG ROCKET</title>
<script src="https://cdn.jsdelivr.net/npm/web3@1.8.2/dist/web3.min.js"></script>
<style>
body{background:#0b0f1a;color:#fff;font-family:Arial;padding:15px;margin:0}
.card{background:#151a2a;border:1px solid #2a3350;border-radius:14px;padding:18px;margin:12px 0}
.btn{background:#00ff88;color:#000;border:0;padding:14px;width:100%;border-radius:10px;font-weight:900;cursor:pointer;font-size:16px}
.pkg{background:#1c233a;border:1px solid #2a3350;border-radius:12px;padding:14px;margin:8px 0}
</style>
</head>
<body>
<h1 style="color:#00ff88">🚀 MGG ROCKET</h1>

<div class="card">
<button class="btn" id="cBtn" onclick="connect()">🔗 Connect Wallet</button>
<p id="addr" style="font-size:12px;word-break:break-all;margin-top:10px">Not Connected</p>
<p style="margin-top:12px;font-size:13px">My Referral Link:</p>
<p id="refLink" style="background:#0e1322;padding:10px;border-radius:8px;color:#00ff88;font-size:12px;word-break:break-all">Connect झाल्यावर येईल</p>
<button class="btn" style="background:#ffaa00;margin-top:8px" onclick="copyLink()">📋 Copy Referral Link</button>
</div>

<div class="card">
<h3>📦 Packages - Full Amount</h3>
<div id="pkgs"></div>
</div>

<script>
const CONTRACT = "0x843162bFc44b13dAAdB13652681b3902332f324D";
const ABI = [{"inputs":[{"internalType":"uint256","name":"_level","type":"uint256"},{"internalType":"address","name":"_upline","type":"address"}],"name":"join","outputs":[],"stateMutability":"payable","type":"function"}];
const PRICES = [2,5,10,20,50,100,200,500,1000,2000,3000,5000,7000,9000,10000];
let web3, contract, user;
let upline = new URLSearchParams(location.search).get('ref') || "0x0000000000000000000000000000000000000000";

function loadPkgs(){
 let h="";
 PRICES.forEach((p,i)=>{
  h+=`<div class="pkg"><b>$${p} - Level ${i+1}</b><br><small>Full Amount - No Upgrade</small><br><button class="btn" style="margin-top:8px" onclick="buy(${i})">Buy $${p}</button></div>`;
 });
 document.getElementById('pkgs').innerHTML=h;
}
loadPkgs();

async function connect(){
 if(!window.ethereum) return alert("Metamask मध्ये उघड");
 web3 = new Web3(window.ethereum);
 await window.ethereum.request({method:"eth_requestAccounts"});
 const a = await web3.eth.getAccounts(); user=a[0];
 document.getElementById('addr').innerText="✅ "+user;
 document.getElementById('cBtn').innerText="✅ "+user.slice(0,6)+"..."+user.slice(-4);
 document.getElementById('refLink').innerText=location.origin+"?ref="+user;
 contract = new web3.eth.Contract(ABI, CONTRACT);
}
function copyLink(){ navigator.clipboard.writeText(document.getElementById('refLink').innerText); alert("Copied!"); }

async function buy(lvl){
 if(!user) return alert("Connect कर आधी!");
 const val = web3.utils.toWei(PRICES[lvl].toString(),'ether');
 try{ await contract.methods.join(lvl, upline).send({from:user, value:val}); alert("Success! $"+PRICES[lvl]+" Joined!"); }
 catch(e){ alert(e.message); }
}
</script>
</body>
</html>
