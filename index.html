<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGG ROCKET - USDT BEP20</title>
<script src="https://cdn.jsdelivr.net/npm/web3@1.8.2/dist/web3.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#111;border:2px solid #FFD700;border-radius:15px;padding:20px;margin:15px auto;max-width:500px}
.btn{background:linear-gradient(45deg,#FFD700,#FFA500);color:#000;padding:12px 25px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin:5px;width:90%;font-size:16px}
.level{border:1px solid #333;padding:10px;margin:5px;border-radius:8px;cursor:pointer}
.level.active{border-color:#FFD700;background:#222}
.refund{background:#ff3333;color:#fff}
</style>
</head>
<body>
<h1 style="color:#FFD700">🚀 MGG ROCKET</h1>
<p>USDT BEP20 | System 0 | 1 Direct = Global</p>

<div class="card">
<button class="btn" onclick="connect()">Connect Wallet</button>
<p id="wallet">Not Connected</p>
<p id="direct">Direct Count: -</p>
<p id="balance">USDT Balance: -</p>
</div>

<div class="card">
<h3>Select Level</h3>
<div id="levels"></div>
<p>Upline: <input id="upline" placeholder="0x..." style="width:90%;padding:8px"></p>
<button class="btn" onclick="approve()">1 Approve USDT</button>
<button class="btn" onclick="join()">2 Join Level</button>
</div>

<div class="card">
<h3>Global Rule</h3>
<div id="refundArea"></div>
</div>

<script>
let web3, account, usdt, rocket;
const USDT_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
const ROCKET_ADDRESS = "PUT_YOUR_ADDRESS_HERE";
const USDT_ABI = [{"inputs":[{"internalType":"address","name":"spender","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"approve","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"address","name":"account","type":"address"}],"name":"balanceOf","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}];
const ROCKET_ABI = [{"inputs":[{"internalType":"uint256","name":"_level","type":"uint256"},{"internalType":"address","name":"_upline","type":"address"}],"name":"join","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"address","name":"","type":"address"}],"name":"directCount","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"","type":"address"},{"internalType":"uint256","name":"","type":"uint256"}],"name":"isActive","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"_level","type":"uint256"}],"name":"claimRefund","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"packages","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}];
let selectedLevel=0;
const pkgs=[2,5,10,20,50,100,200,500,1000,2000,3000,5000,7000,9000,10000];
window.onload=()=>{
 let div=document.getElementById("levels");
 pkgs.forEach((p,i)=>{div.innerHTML+=`<div class="level" id="l${i}" onclick="selectLevel(${i})">Level ${i+1} = ${p} USDT</div>`;});
 const urlParams=new URLSearchParams(window.location.search);
 if(urlParams.get('ref')) document.getElementById('upline').value=urlParams.get('ref');
}
function selectLevel(i){selectedLevel=i;document.querySelectorAll('.level').forEach(e=>e.classList.remove('active'));document.getElementById('l'+i).classList.add('active');checkRefund();}
async function connect(){
 web3=new Web3(window.ethereum);
 await window.ethereum.request({method:'eth_requestAccounts'});
 let accounts=await web3.eth.getAccounts();account=accounts[0];
 document.getElementById('wallet').innerText=account.slice(0,6)+"..."+account.slice(-4);
 usdt=new web3.eth.Contract(USDT_ABI,USDT_ADDRESS);
 rocket=new web3.eth.Contract(ROCKET_ABI,ROCKET_ADDRESS);
 let bal=await usdt.methods.balanceOf(account).call();
 document.getElementById('balance').innerText="USDT Balance: "+web3.utils.fromWei(bal,'ether');
 let dc=await rocket.methods.directCount(account).call();
 document.getElementById('direct').innerText="Direct Count: "+dc;
 checkRefund();
}
async function checkRefund(){
 if(!rocket||!account) return;
 try{
 let dc=await rocket.methods.directCount(account).call();
 let active=await rocket.methods.isActive(account,selectedLevel).call();
 let area=document.getElementById('refundArea');
 if(active&&dc==0){area.innerHTML=`<p style="color:#ff3333">0 Direct - No Global!</p><button class="btn refund" onclick="claimRefund()">Claim Refund Level ${selectedLevel+1}</button>`;}
 else if(active&&dc>=1){area.innerHTML=`<p style="color:#00ff00">Eligible for Global! Direct: ${dc}</p>`;}
 else{area.innerHTML=`<p>Join First</p>`;}
 }catch(e){}
}
async function approve(){
 let amount=web3.utils.toWei(pkgs[selectedLevel].toString(),'ether');
 await usdt.methods.approve(ROCKET_ADDRESS,amount).send({from:account});
 alert("Approved "+pkgs[selectedLevel]+" USDT");
}
async function join(){
 let upl=document.getElementById('upline').value||"0x0000000000000000000000000000000000000000";
 await rocket.methods.join(selectedLevel,upl).send({from:account});
 alert("Joined Level "+(selectedLevel+1));checkRefund();
}
async function claimRefund(){
 await rocket.methods.claimRefund(selectedLevel).send({from:account});
 alert("Refund Claimed - Contact Creator");
}
</script>
</body>
</html>
