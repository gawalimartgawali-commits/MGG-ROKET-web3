<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGG ROCKET</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.8.1/dist/ethers.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#0a0e1a;color:#fff;font-family:system-ui;padding:12px}
.card{background:#151c2f;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #1e293b}
.logo{color:#ff7a00;font-weight:900;font-size:22px} .btn{padding:12px;border-radius:12px;font-weight:800;border:none;cursor:pointer}
.btn-orange{background:#ff7a00;color:#fff} .btn-green{background:#00ff88;color:#000;width:100%;margin-top:8px}
input{width:100%;background:#000;border:1px solid #333;padding:14px;border-radius:10px;color:#fff;margin:8px 0}
.pkgBtn{background:#1a233a;border:1px solid #ff7a00;color:#fff;padding:12px;border-radius:10px;font-weight:700;font-size:13px}
</style>
</head>
<body>

<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<div class="logo">🚀 MGG ROCKET</div>
<button class="btn btn-orange" id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
</div>

<div class="card">
<div style="color:#8892b0;font-size:11px">CONNECTED WALLET</div>
<div id="walletAddr" style="color:#ff7a00;font-weight:700;margin:6px 0">Not Connected</div>
<div style="display:flex;justify-content:space-between;font-size:13px"><span>Network:</span><span>BNB Smart Chain</span></div>
</div>

<!-- ALL 15 PACKAGES -->
<div class="card" style="border:2px solid #ff7a00">
<div style="font-weight:900;font-size:16px">🎯 ACTIVATE PACKAGE - ALL 15 LEVELS</div>
<input id="refInput" placeholder="Referral: 0x...">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">
<button onclick="buyPkg(2)" class="pkgBtn">$2 BUY</button>
<button onclick="buyPkg(5)" class="pkgBtn">$5 BUY</button>
<button onclick="buyPkg(10)" class="pkgBtn">$10 BUY</button>
<button onclick="buyPkg(20)" class="pkgBtn">$20 BUY</button>
<button onclick="buyPkg(50)" class="pkgBtn">$50 BUY</button>
<button onclick="buyPkg(100)" class="pkgBtn">$100 BUY</button>
<button onclick="buyPkg(200)" class="pkgBtn">$200 BUY</button>
<button onclick="buyPkg(500)" class="pkgBtn">$500 BUY</button>
<button onclick="buyPkg(1000)" class="pkgBtn">$1000 BUY</button>
<button onclick="buyPkg(2000)" class="pkgBtn">$2000 BUY</button>
<button onclick="buyPkg(3000)" class="pkgBtn">$3000 BUY</button>
<button onclick="buyPkg(5000)" class="pkgBtn">$5000 BUY</button>
<button onclick="buyPkg(7000)" class="pkgBtn">$7000 BUY</button>
<button onclick="buyPkg(9000)" class="pkgBtn">$9000 BUY</button>
<button onclick="buyPkg(10000)" class="pkgBtn" style="background:#ff7a00;color:#000">$10000 BUY</button>
</div>
</div>

<div class="card">
<div style="color:#8892b0;font-size:12px">USDT BALANCE</div>
<div style="color:#00ff88;font-size:32px;font-weight:900">0.00 USDT</div>
<button onclick="copyRef()" style="background:#222;color:#ff7a00;border:1px solid #333;padding:8px 14px;border-radius:20px;font-size:12px;margin-top:8px">🔗 My Referral Link Copy करा</button>
</div>

<div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="card">
<div style="color:#8892b0;font-size:12px">APP WALLET (20%)</div>
<div style="color:#60a5fa;font-size:24px;font-weight:900">0.00 USDT</div>
<div style="font-size:11px;color:#ff7a00">Direct: 0 ❌ Global बंद</div>
</div>
<div class="card">
<div style="color:#8892b0;font-size:12px">ID WALLET (70%)</div>
<div style="color:#c084fc;font-size:24px;font-weight:900">0.00 USDT</div>
<div style="font-size:11px">Live Members: 0</div>
<button class="btn btn-green">Claim ID</button>
</div>
</div>

<div class="card" style="border:2px solid #00ff88">
<div style="color:#8892b0;font-size:12px">TOTAL INCOME</div>
<div style="color:#00ff88;font-size:32px;font-weight:900">0.00 USDT</div>
</div>

<div class="card" style="border:2px solid #ff3b3b">
<div style="font-weight:900;color:#ff3b3b">💸 100% REFUND</div>
<div style="background:#ff000011;padding:10px;border-radius:8px;font-size:13px;margin-top:8px">✅ Eligible: $0.00</div>
<button style="background:#ff3b3b;color:#fff;width:100%;padding:14px;border-radius:12px;font-weight:900;margin-top:10px;border:none">REFUND CLAIM</button>
</div>

<script>
let userAddress=null;
const params=new URLSearchParams(window.location.search);
if(params.get('ref')){ setTimeout(()=>{ document.getElementById('refInput').value=params.get('ref'); },500); }
async function connectWallet(){
 if(!window.ethereum){ alert('Trust Wallet / MetaMask मध्ये उघडा!'); return; }
 const provider=new ethers.BrowserProvider(window.ethereum);
 const accounts=await provider.send("eth_requestAccounts",[]);
 userAddress=accounts[0];
 document.getElementById('walletAddr').innerText=userAddress.slice(0,6)+'...'+userAddress.slice(-4)+' ✅';
 document.getElementById('connectBtn').innerText='Connected';
}
async function buyPkg(amount){
 if(!userAddress){ alert('आधी Connect Wallet करा!'); return; }
 let ref=document.getElementById('refInput').value;
 alert('Package $'+amount+' Active करत आहे... Ref: '+ref);
}
function copyRef(){
 if(!userAddress){ alert('आधी Connect करा'); return; }
 let link=window.location.origin+"/?ref="+userAddress;
 navigator.clipboard.writeText(link); alert('Link Copy झाला: '+link);
}
</script>
</body>
</html>
