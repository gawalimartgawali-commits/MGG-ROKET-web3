<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGG ROCKET</title>
<script src="https://cdn.jsdelivr.net/npm/web3@1.8.2/dist/web3.min.js"></script>
<style>
body{background:#0b0f1a;color:#fff;font-family:Arial;padding:12px;margin:0}
.card{background:#151a2a;border:1px solid #2a3350;border-radius:16px;padding:18px;margin:14px 0}
.btn{background:#00ff88;color:#000;border:0;padding:14px;width:100%;border-radius:10px;font-weight:900;cursor:pointer;font-size:16px}
.btn2{background:#ffaa00;color:#000;padding:12px;width:100%;border-radius:10px;font-weight:900;margin-top:8px;border:0;cursor:pointer}
.pkg{background:#1c233a;border:1px solid #2a3350;border-radius:12px;padding:14px;margin:10px 0}
.wallet-box{background:#0e1322;border:1px solid #00ff8833;border-radius:10px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.green{color:#00ff88;font-weight:900}
</style>
</head>
<body>
<h1 style="color:#00ff88">🚀 MGG ROCKET</h1>

<div class="card">
<button class="btn" id="cBtn" onclick="connect()">🔗 Connect Wallet</button>
<p id="addr" style="font-size:12px;margin-top:10px;word-break:break-all">Not Connected</p>
<p style="margin-top:12px">My Referral Link:</p>
<p id="refLink" style="background:#0e1322;padding:10px;border-radius:8px;color:#00ff88;font-size:12px;word-break:break-all">Connect झाल्यावर येईल</p>
<button class="btn2" onclick="copyLink()">📋 Copy Referral Link</button>
</div>

<!-- WALLET SECTION - हेच तुला पाहिजे होतं -->
<div class="card">
<h3 style="color:#00ff88">💰 माझे Wallets - Income</h3>
<p style="font-size:12px;color:#8a94b0">प्रत्येक Package चं Direct (20%) आणि Global (70%) वेगळं</p>
<div id="walletSection">
<div class="wallet-box"><span>Direct Wallet (20%)</span><span class="green" id="directBal">$0.00</span></div>
<div class="wallet-box"><span>Global Wallet (70%)</span><span class="green" id="globalBal">$0.00</span></div>
<div class="wallet-box"><span>Total Claimed</span><span class="green" id="claimedBal">$0.00</span></div>
<button class="btn" style="margin-top:10px;background:#00aaff;color:#fff" onclick="claimAll()">💸 Claim All Income</button>
<p id="walletStatus" style="font-size:11px;color:#8a94b0;margin-top:8px;text-align:center">Connect केल्यावर Balance येईल</p>
</div>
</div>

<div class="card">
<h3>📦 Packages - Full Amount</h3>
<div id="pkgs"></div>
</div>

<script>
const CONTRACT = "0x843162bFc44b13dAAdB13652681b3902332f324D";
const ABI = [
{"inputs":[{"internalType":"uint256","name":"_level","type":"uint256"},{"internalType":"address","name":"_upline","type":"address"}],"name":"join","outputs":[],"stateMutability":"payable","type":"function"},
{"inputs":[{"internalType":"uint256","name":"_level","type":"uint256"}],"name":"claimAppWallet","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"uint256","name":"_level","type":"uint256"}],"name":"claimIdWallet","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"address","name":"_user","type":"address"},{"internalType":"uint256","name":"_level","type":"uint256"}],"name":"getUserLevelInfo","outputs":[{"internalType":"uint256","name":"paid","type":"uint256"},{"internalType":"uint256","name":"direct","type":"uint256"},{"internalType":"uint256","name":"globalInc","type":"uint256"},{"internalType":"uint256","name":"claimed","type":"uint256"},{"internalType":"uint256","name":"maxInc","type":"uint256"},{"internalType":"uint256","name":"remaining","type":"uint256"}],"stateMutability":"view","type":"function"}
];
const PRICES = [2,5,10,20,50,100,200,500,1000,2000,3000,5000,7000,9000,10000];
let web3, contract, user;
let upline = new URLSearchParams(location.search).get('ref') || "0x0000000000000000000000000000000000000000";

function loadPkgs(){
 let h="";
 PRICES.forEach((p,i)=>{
  h+=`<div class="pkg"><div style="display:flex;justify-content:space-between"><b>$${p} - Level ${i+1}</b><span style="color:#00ff88;font-size:12px">Max $${p*3}</span></div><small>Full Amount - No Upgrade - 10% Creator | 20% Direct | 70% Global</small><br><button class="btn" style="margin-top:8px" onclick="buy(${i})">Buy $${p}</button></div>`;
 });
 document.getElementById('pkgs').innerHTML=h;
}
loadPkgs();

async function connect(){
 if(!window.ethereum) return alert("Metamask मध्ये उघड");
 web3 = new Web3(window.ethereum);
 await window.ethereum.request({method:"eth_requestAccounts"});
 const a = await web3.eth.getAccounts(); user=a[0];
 document.getElementById('addr').innerText="✅ "+user;
 document.getElementById('cBtn').innerText="✅ "+user.slice(0,6)+"..."+user.slice(-4);
 document.getElementById('refLink').innerText=location.origin+"?ref="+user;
 contract = new web3.eth.Contract(ABI, CONTRACT);
 loadWallets();
}

async function loadWallets(){
 let totalDirect=0, totalGlobal=0, totalClaimed=0;
 for(let i=0;i<15;i++){
  try{
   const info = await contract.methods.getUserLevelInfo(user, i).call();
   totalDirect += parseFloat(web3.utils.fromWei(info.direct,'ether'));
   totalGlobal += parseFloat(web3.utils.fromWei(info.globalInc,'ether'));
   totalClaimed += parseFloat(web3.utils.fromWei(info.claimed,'ether'));
  }catch(e){}
 }
 document.getElementById('directBal').innerText="$"+totalDirect.toFixed(4);
 document.getElementById('globalBal').innerText="$"+totalGlobal.toFixed(4);
 document.getElementById('claimedBal').innerText="$"+totalClaimed.toFixed(4);
 document.getElementById('walletStatus').innerText="✅ "+(totalDirect+totalGlobal>0 ? "Income Ready - Claim कर!" : "अजून Income नाही - Referral शेअर कर!");
}

function copyLink(){ navigator.clipboard.writeText(document.getElementById('refLink').innerText); alert("Copied!"); }

async function buy(lvl){
 if(!user) return alert("Connect कर आधी!");
 const val = web3.utils.toWei(PRICES[lvl].toString(),'ether');
 try{ await contract.methods.join(lvl, upline).send({from:user, value:val}); alert("Success! $"+PRICES[lvl]); loadWallets(); }
 catch(e){ alert(e.message); }
}

async function claimAll(){
 if(!user) return;
 for(let i=0;i<15;i++){
  try{ 
   const info = await contract.methods.getUserLevelInfo(user, i).call();
   if(parseFloat(web3.utils.fromWei(info.direct,'ether'))>0) await contract.methods.claimAppWallet(i).send({from:user});
   if(parseFloat(web3.utils.fromWei(info.globalInc,'ether'))>0) await contract.methods.claimIdWallet(i).send({from:user});
  }catch(e){}
 }
 alert("Claimed!"); loadWallets();
}
</script>
</body>
</html>
